version: "5.1.0"
spec: 270
name: "Mistweaver Monk Method"
description: "Minimal test build."
author: "Khan"
date: "2026-09-21"

config:
  vivify_threshold:
    section: "Healing"
    type: slider
    label: "Vivify HP %"
    min: 1
    max: 100
    default: 94

lists:
  main:
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=auto_target
    - call_action_list,name=auto_heal,if=player.combat
    - return,if=!player.combat
    - vivify,target=lowest,if=group.lowest.health.effective.pct<config.vivify_threshold&group.lowest.range<=40

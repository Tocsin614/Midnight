version: 5.1.0
author: Khan
spec: 256
name: Khan Discipline Priest
date: "2026-09-21"
description: |
  Minimal test build.

config:
  flash_heal_threshold:
    label: "Flash Heal HP %"
    type: slider
    min: 30
    max: 80
    default: 50

lists:
  out_of_combat:
    - power_word_fortitude,range_check=none,if=group.count(cycle.buff.power_word_fortitude.down.any)>0

  main:
    - call_action_list,name=spell_queue
    - call_action_list,name=sanity_checks
    - call_action_list,name=auto_target_ranged
    - call_action_list,name=auto_heal,if=player.combat
    - call_action_list,name=out_of_combat,if=!player.combat
    - return,if=!player.combat
    - flash_heal,cycle=members,if=cycle.health.effective.pct<config.flash_heal_threshold
